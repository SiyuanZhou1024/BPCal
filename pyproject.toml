[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bpcal"
version = "1.0.0"
description = "Boundary-aware prototype calibration for spatial domain identification in spatial transcriptomics"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
authors = [{ name = "Siyuan Zhou", email = "sorenyuan_zhou@126.com" }]
keywords = ["spatial transcriptomics", "spatial domain", "clustering"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
    "scikit-learn>=1.1",
]

[project.optional-dependencies]
io = ["h5py>=3.0", "anndata>=0.8", "scanpy>=1.9", "pandas>=1.4"]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/SiyuanZhou1024/BPCal"

[tool.setuptools]
packages = ["bpcal"]
